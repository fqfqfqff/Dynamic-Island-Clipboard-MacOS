name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Показать версию Swift
        run: swift --version

      - name: Сборка
        run: swift build -v

      - name: Тесты
        run: swift test -v

      - name: Проверить, что приложение собирается в бандл
        run: ./Scripts/build.sh release

      # Расход растёт незаметно: скрытое окно витрины однажды съедало
      # процент процессора и 60 МБ впустую. На раннере разрешений нет,
      # поэтому число — это нижняя граница, а не боевая; ловится тут не
      # точный расход, а его резкий рост. Код 2 — «замерить не вышло»,
      # это не поломка сборки.
      - name: Расход в покое
        run: |
          ./Scripts/bench.sh || status=$?
          [ "${status:-0}" -ne 2 ] || echo "::notice::замер пропущен — нет графической сессии"
          [ "${status:-0}" -ne 1 ] || exit 1
